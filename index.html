<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Big picture buttons for showing how you feel and what you want.">
  <title>Picture Buttons</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="at-home">

  <header class="strip">
    <!-- Shown instead of the message strip while editing -->
    <div class="edit-toolbar">
      <button id="edit-add" class="tool tool-add" type="button">
        <span class="plus" aria-hidden="true">+</span> Add
      </button>
      <button id="edit-undo" class="tool" type="button" disabled>
        <span aria-hidden="true">↩️</span> Undo
      </button>
      <button id="edit-reset" class="tool tool-reset" type="button">Reset</button>
      <span class="toolbar-spacer"></span>
      <button id="edit-done" class="tool tool-done" type="button">Done</button>
    </div>

    <div id="sentence" class="sentence"></div>
    <div class="controls">
      <button id="say" class="btn btn-say" type="button" aria-label="Say my message">
        <span aria-hidden="true">🔊</span>
      </button>
      <div class="btn-stack">
        <button id="undo" class="btn btn-small" type="button" aria-label="Take away the last picture">
          <span aria-hidden="true">⬅️</span>
        </button>
        <button id="clear" class="btn btn-small" type="button" aria-label="Clear all pictures">
          <span aria-hidden="true">🗑️</span>
        </button>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <footer>
    <label class="toggle">
      <input id="words" type="checkbox">
      Show words
    </label>
  </footer>

  <!-- "Add a button" form. Only reachable from edit mode. -->
  <div id="add-dialog" class="backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="add-title">
      <h2 id="add-title">Add a button</h2>

      <p class="step">What should the button show?</p>
      <div class="kinds">
        <button type="button" class="kind" data-kind="emoji" aria-pressed="true">
          <span aria-hidden="true">😀</span> Emoji
        </button>
        <button type="button" class="kind" data-kind="photo" aria-pressed="false">
          <span aria-hidden="true">📷</span> Photo
        </button>
        <button type="button" class="kind" data-kind="text" aria-pressed="false">
          <span aria-hidden="true">🔤</span> Words
        </button>
      </div>

      <div class="pane" data-pane="emoji">
        <div id="emoji-suggest" class="emoji-suggest"></div>
        <label class="field">
          Or type any emoji
          <input id="emoji-input" type="text" maxlength="16" autocomplete="off">
        </label>
      </div>

      <div class="pane" data-pane="photo" hidden>
        <div class="photo-options">
          <label class="file-btn">
            <span aria-hidden="true">📷</span> Take or choose a photo
            <input id="photo-input" class="visually-hidden" type="file" accept="image/*">
          </label>
          <button id="paste-btn" type="button" class="file-btn">
            <span aria-hidden="true">📋</span> Paste a copied picture
          </button>
        </div>
        <p id="photo-status" class="status" aria-live="polite"></p>
        <p class="hint">On a computer you can also press Ctrl+V (⌘V on a Mac). Pictures stay on this device and are never uploaded.</p>
      </div>

      <div class="pane" data-pane="text" hidden>
        <label class="field">
          Words on the button
          <input id="text-input" type="text" maxlength="24" autocomplete="off">
        </label>
      </div>

      <label class="field">
        What should it say out loud?
        <input id="say-input" type="text" maxlength="80" autocomplete="off" placeholder="For example: Grandma">
      </label>

      <div class="preview-row">
        <span class="step">Preview</span>
        <div id="preview"></div>
      </div>

      <div class="dialog-actions">
        <button id="add-cancel" type="button" class="action action-quiet">Cancel</button>
        <button id="add-save" type="button" class="action action-go" disabled>Add button</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
